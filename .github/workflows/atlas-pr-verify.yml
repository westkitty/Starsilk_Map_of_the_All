name: Atlas Pull Request Verification

on:
  pull_request:
    branches: [main, consolidation/phase-02-omni-recovery-20261020, feature/phase03-stellar-navigation, feature/phase04-zero-loss-ux, feature/phase05-network-batching, feature/phase05-frame-observability, feature/phase15-provisional-survey-cells, feature/phase16-region-render-economy, feature/phase17-safe-cartography-labels, feature/phase06-release-cutover-safety, feature/phase06-two-client-browser-replay, feature/phase06-external-writer-conflict-fence]

# Read-only validation; never publishes or modifies GitHub Pages.
permissions:
  contents: read

concurrency:
  group: atlas-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Atlas build, browser and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Validate all Node tests and production bundle
        run: npm run check

      - name: Check application and recovery script syntax
        run: |
          set -eu
          for file in main.js atlas-engine.js atlas-data.js draft-recovery.js spatial-studio.js strategic-studio.js temporal-lab.js; do
            node --check "$file"
          done
          if [ -f scripts/phase1-draft-recovery-browser-ci.mjs ]; then
            node --check scripts/phase1-draft-recovery-browser-ci.mjs
          fi
          if [ -f scripts/stellar-zoom-browser-ci.mjs ]; then
            node --check scripts/stellar-zoom-browser-ci.mjs
            node --check system-zoom.js
          fi
          if [ -f scripts/phase4-discovery-browser-ci.mjs ]; then
            node --check scripts/phase4-discovery-browser-ci.mjs
          fi
          node --check network-geometry.js
          node --check frame-timing.js
          node --check scripts/phase5-cadence-browser-ci.mjs
          node --check survey-sectors.js
          node --check scripts/phase15-survey-browser-ci.mjs
          node --check scripts/phase16-region-browser-ci.mjs
          node --check scripts/phase16-matched-draw-benchmark.mjs
          node --check scripts/phase17-labels-browser-ci.mjs
          node --check release-cutover-gate.js
          node --check scripts/phase6-release-gate.mjs
          node --check scripts/phase6-two-client-browser-ci.mjs

      - name: Run existing Chromium acceptance suites
        run: npm run test:browser

      - name: Prove disposable-profile backup and restore
        run: |
          set -eu
          if [ -f scripts/phase1-draft-recovery-browser-ci.mjs ]; then
            node scripts/phase1-draft-recovery-browser-ci.mjs
          else
            echo "Phase 1 recovery fixture is not present in this branch."
          fi

      - name: Retain browser diagnostic images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-pr-browser-evidence
          path: atlas-qa-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
  legacy-same-origin:
    name: Pinned Planner collision plus read-only retirement preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated Atlas PR
        uses: actions/checkout@v4
        with:
          path: atlas
          persist-credentials: false

      - name: Checkout original Planner by immutable commit (read-only)
        uses: actions/checkout@v4
        with:
          repository: westkitty/Star_System_Planner
          ref: dc3c742743838757aaafed9e637d95a5aa814596
          path: planner
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build candidate Atlas
        working-directory: atlas
        run: |
          npm ci
          npm run build

      - name: Verify independent Planner without modifying its repository
        working-directory: planner
        run: |
          npm ci
          npm run check

      - name: Replay pinned two-client writer collision in disposable browser context
        run: node atlas/scripts/phase6-two-client-browser-ci.mjs atlas/dist planner/dist
      - name: Prove read-only legacy retirement preview in disposable built Planner
        run: |
          set -eu
          cp atlas/docs/consolidation/LEGACY_RETIREMENT_PREVIEW.html planner/map-of-the-all/index.html
          cd planner
          npm run build
          cd ..
          node atlas/scripts/phase6-two-client-browser-ci.mjs atlas/dist planner/dist --retired

